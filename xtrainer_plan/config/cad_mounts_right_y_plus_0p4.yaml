# run_rviz 可视化挂载变体：以 cad_mounts.yaml 的原始对角布局为基线，
# 只把 right_arm 沿 CAD 装配体（scene_root）的原始 +Y 方向平移 0.4 m。
#
#   -0.230206 + 0.400000 = 0.169794 m
#
# left_arm、两臂姿态以及 x/z 均保持不变；原始配置不会被覆盖。

left_arm:
  xyz: [-0.478775, 0.50794, 0.456503]
  rpy: [3.141592653589793, 0.0, 2.9687592653589793]

right_arm:
  xyz: [0.321225, -0.239794, 0.456503]
  rpy: [3.141592653589793, 0.0, 0.0]

step_filter:
  excluded_name_contains: "DOBOT Nova 2"
