# =============================================================================
# place 位置区域扫描 —— 找「哪个 place 位置能让更远的 grasp 点可达」
#
# 与 pick_place_default.yaml 的关系:
#   本文件只写「扫描专属」的配置。robot / workspace / planner / criterion /
#   lift / linear_move / base_rpy / angle_search 全部继承 base_config 指向的
#   那份文件，保证扫描口径与正式规划完全一致（改一处两边同步）。
#
# 三阶段流程:
#   阶段1  逐个 grasp 位置试 IK。某角度失败就试下一个旋转角，全失败则跳过该位置。
#          「保留所有可行角度」而非只留第一个 —— 留多个可让阶段3 有备选。
#   阶段2  同上，逐个 place 位置试 IK，保留所有可行角度。
#   阶段3  只对「阶段1 和阶段2 都可行」的 (grasp, place) 组合做轨迹规划。
#          规划失败或关节变化超过 criterion.max_joint_delta_deg 则跳过该 grasp 点。
#
# 排名: 先要求三阶段都成功（该 place 自身 IK 可行 且 至少一个 grasp 规划成功），
#       再按「规划成功的 grasp 点位数」从多到少排，取 Top-N。
#
# 用法:
#   ./run_place_scan.sh --stage 12   # 阶段1+2（IK 筛选，快），结果存盘
#   ./run_place_scan.sh --stage 3 --out-dir results_place_scan/<时间戳>
#                                    # 阶段3（轨迹规划，慢），读盘续跑
#   ./run_place_scan.sh --stage all  # 依次跑完三个阶段
# =============================================================================

# 继承的基础配置（相对本仓库 xtrainer_plan 目录）
base_config: config/pick_place_default.yaml


# ---------------- grasp 候选区域（阶段1 筛选对象）----------------
grasp_region:
  x_range: [-0.61, -0.2]
  y_range: [-0.05, 0.25]
  z: 0.03

  # 网格间距 (m)。
  # 【重要】这个值最好与 stage3.grasp_region.step 一致或成整数倍，
  # 否则阶段3 的点在阶段1 没有对应数据，只能退回「全部候选角度」，
  # 阶段1 的筛选加速对那些点就失效了（脚本启动时会打印 [WARN] 覆盖率）。
  # 当前 0.03 与 stage3 一致，阶段3 的每个点都能命中阶段1 的结果。
  step: 0.03

  # 是否只扫最外围一圈。
  # 【重要】同样影响覆盖率：阶段1 只扫外围、阶段3 扫全网格时，
  # 中间那些点阶段1 没算过。所以这里默认 false（全网格），
  # 与 stage3 的 perimeter_only: false 对齐。
  #
  # 若想省时间只摸边界，把这里改 true，同时把 stage3.grasp_region.perimeter_only
  # 也改 true，保持两阶段口径一致。
  perimeter_only: false

  # ===== 只算某一条边 =====
  # 【怎么改】all / x_min / x_max / y_min / y_max
  #   all   = 不按边筛选，由上面的 perimeter_only 决定
  #   x_min = 只算 x 最小的那条边（离基座最远的一列），点数最少、最快
  #   x_max = x 最大那条边（离基座最近）
  # 【优先级】edge != all 时优先于 perimeter_only，后者被忽略。
  # 【提醒】实测 x <= -0.57 的几列全部超出臂展、IK 无解。用 x_min 时请先把
  #         x_range 下界收到臂展内（如 -0.56），否则阶段1 会全部跳过。
  edge: all


# ---------------- place 候选区域（阶段2 筛选对象，也是被排名的对象）----------------
place_region:
  x_range: [-0.23, -0.13]
  y_range: [-0.26, -0.16]
  # z 固定（不参与扫描）
  z: 0.1
  # 0.01 = 1cm -> 11 x 11 = 121 个候选
  step: 0.01
  # 只取区域的某一条边。all=整片区域
  edge: all


# ---------------- 角度搜索（阶段1、2、3 共用）----------------
# 【重要】本段是「覆盖层」，不是完整定义。
# 实际生效 = pick_place_default.yaml 的 pick_place.angle_search 深度合并本段。
# 因此以下逻辑全部与 run_pick_place.sh 共用同一份实现，不会两边漂移：
#   * couple_place_to_grasp 的耦合符号规则（由 grasp.min_deg 符号决定
#     p = g 还是 p = -g，见 couple_sign）
#   * strategy（abs_sum / coarse_to_fine）与 coarse_place
#   * max_trials 截断
#   * stage2 第二阶段旋转（含 frame: base/tool）
#
# 没写的项会自动继承，例如 axis: x、order: abs、strategy: coarse_to_fine。
# 留空 {} 即完全沿用正式规划的角度配置。
#
# 【为什么这里要覆盖 place 范围到 -90】
# 实测这片 place 区域大部分点需要较大负向工具转角才有 IK 解，例如
#   place=[-0.23,-0.26,0.1] 可行角 = [-90,-75,-60,-45,-30]，0/-10/-20 全无解
#   place=[-0.13,-0.16,0.1] 可行角 = [-90,-60,-45,-30,-15,0,15]
# 若沿用正式规划的 [-30,0]，绝大多数 place 会在阶段2 被全部跳过。
#
# 【为什么这里把耦合关掉】
# 耦合会让 place 角被 grasp 角绑死（p=g 或 p=-g），而 grasp 侧适合的角度
# （0 附近）恰好是 place 侧无解的角度，两边诉求冲突。
# 若要考察「耦合约束下的可达性」，把 couple_place_to_grasp 改成 true 即可，
# 此时 place 的角度范围会被忽略（与正式规划行为一致）。
#
# 【步长与耗时】阶段1/2 的 IK 次数 = 位置数 x 角度数 x 3 路点。
# 单次 IK 约 0.24s，所以步长直接决定筛选耗时，建议比正式规划粗。
angle:
  grasp: {min_deg: -30.0, max_deg: 0.0, step_deg: 15.0}
  place: {min_deg: -90.0, max_deg: 15.0, step_deg: 15.0}
  couple_place_to_grasp: true
  # 扫描不做截断，完整遍历（正式规划里是 1200）
  max_trials: 0
  # 第二阶段旋转：默认沿用正式规划的开关（当前是关）。
  # 想在扫描里也探索就打开，注意候选数会乘上它的组合数，耗时同比增长。
  # stage2:
  #   enable: true
  #   step_deg: 30.0


# ---------------- 阶段3: 轨迹规划 ----------------
stage3:
  # 阶段3 专用的 grasp 网格（覆盖上面 grasp_region 的同名项）。
  # 阶段1 用细网格（1cm 外围）找可达边界；阶段3 放粗且扫全网格，
  # 这样出的是「哪个位置能到、哪个不能到」的实心图。
  #   3cm 全网格 = 15 x 11 = 165 点
  # 耗时按点数线性增长（单次规划约 6~10s）：
  #   step 0.05 -> 9x7=63 点   更快
  #   step 0.03 -> 15x11=165 点（默认）
  #   step 0.02 -> 22x16=352 点 更细更慢
  grasp_region:
    step: 0.01
    perimeter_only: false
    edge: all

  # 每个 grasp 点最多试几组角度（从两侧可行角度的组合里按小角度优先取）。
  # 1 = 只试最贴近基准姿态的那组，最快；设大些更彻底但更慢。
  max_angle_trials: 3

  # ===== 阶段3 专属的 x 上限过滤 =====
  # 只对「x 足够小（足够远离基座）」的点做轨迹规划。
  # 用途：阶段1/2 已把整片区域筛过一遍，但真正关心的往往只是远端那部分；
  #       在阶段3 再收一刀能大幅缩短耗时，且不影响阶段1/2 的完整筛选结果。
  # null 或注释掉 = 不过滤。
  #
  # 【注意】这只在阶段3 生效。阶段1/2 的 IK 可行性图仍然是全区域的，
  #         所以 stage12_*.png 与 stage3_*.png 的点数会不一致，这是预期行为。
  #
  # 当前设置（按需求）：grasp 只取 x <= -0.5，place 只取 x <= -0.2
  #   grasp x[-0.61,-0.2] step 0.03 -> 15x11=165 点，滤后只剩 x∈[-0.61,-0.51] 的 4 列
  #   place x[-0.23,-0.13] step 0.01 -> 11x11=121 点，x<=-0.2 只剩 4 列
  grasp_x_max: -0.5
  place_x_max: -0.2

  # 最终 place 排名取前 N 个
  top_n: 10

  # 逐点规划的起始关节角。
  #   home = 每个点都从 home 出发（各点独立、可比，推荐）
  # 注意: 正式 pick&place 是「上一个物料的终点」接着下一个，与此不同 ——
  #       本扫描要的是「该点位本身能否到达」，故用固定起点消除顺序影响。
  start_from: home
